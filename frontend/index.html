<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Spotit — spot it, back it, watch it get fixed</title>
    <meta
      name="description"
      content="Post the pothole, the dark streetlight, the bin nobody emptied. Neighbours back it, severity is classified on filing, and the corporation works the queue in that order."
    />
    <meta name="color-scheme" content="light dark" />
    <!-- Match --c-canvas in each theme, not the accent. The browser paints this
         behind the page on mobile; a saffron strip above a grey app reads as a
         rendering bug, not as branding. -->
    <meta name="theme-color" content="#f4f5f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1013" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Set the theme before first paint, otherwise dark-mode users get a
      // white flash while React boots.
      (function () {
        try {
          var saved = localStorage.getItem('spotit.theme');
          var dark =
            saved === 'dark' ||
            (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
