<!-- The Spotit mark. Same geometry as components/Logo.jsx, with the theme
     tokens resolved to literals — a favicon is loaded outside the document, so
     it cannot see the app's custom properties.

     The pin body is drawn in ink rather than left transparent, and it carries a
     white keyline, so the mark holds its shape against both a light and a dark
     browser chrome at 16px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <clipPath id="head">
      <circle cx="16" cy="13" r="9" />
    </clipPath>
  </defs>

  <path
    d="M16 30c0 0-10-9.2-10-16.4A10 10 0 0 1 26 13.6C26 20.8 16 30 16 30Z"
    fill="#14161a"
    stroke="#ffffff"
    stroke-width="1.2"
  />

  <g clip-path="url(#head)">
    <rect x="6" y="4" width="20" height="6" fill="#ff8f2e" />
    <rect x="6" y="10" width="20" height="6" fill="#ffffff" />
    <rect x="6" y="16" width="20" height="6" fill="#1a9c4f" />
  </g>

  <circle cx="16" cy="13" r="3.1" fill="#13418f" />
  <circle cx="16" cy="13" r="1.15" fill="#ffffff" />
</svg>
